<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Site Inspection PDF Generator & Previewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --border: #334155;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --blue: #00AEEF;
      --teal: #14B8A6;
      --green: #10B981;
      --amber: #F59E0B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: white;
    }

    .brand-title {
      font-family: 'Manrope', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-tag {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(0, 174, 239, 0.15);
      color: var(--blue);
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid rgba(0, 174, 239, 0.3);
    }

    .container {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 24px;
      padding: 24px 32px;
      flex: 1;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-title {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input, textarea {
      background: #0F172A;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--blue);
    }

    textarea {
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      resize: vertical;
      min-height: 240px;
    }

    .file-dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.5);
      transition: all 0.2s;
    }

    .file-dropzone:hover {
      border-color: var(--blue);
      background: rgba(0, 174, 239, 0.05);
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 100px;
      overflow-y: auto;
    }

    .file-item {
      font-size: 11px;
      background: #0F172A;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .btn {
      background: linear-gradient(135deg, var(--blue), #0088CC);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .preview-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-box {
      background: #0F172A;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .metric-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--blue);
    }

    .metric-lbl {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    iframe {
      width: 100%;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #334155;
      min-height: 600px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">PDF</div>
      <div>
        <div class="brand-title">Modern Site Inspection Generator</div>
        <div style="font-size: 11px; color: var(--muted);">Monday.com & Make.com Binary Multi-Image Engine</div>
      </div>
    </div>
    <span class="brand-tag">Fastify + Playwright + Sharp</span>
  </header>

  <div class="container">
    <!-- LEFT CONTROL PANEL -->
    <div class="panel">
      <div class="panel-title">
        <span>Report Parameters</span>
        <button id="loadSampleBtn" style="background: none; border: none; color: var(--blue); font-size: 12px; cursor: pointer; font-weight: 600;">Reset Sample</button>
      </div>

      <div class="form-group">
        <label>Inspection Template</label>
        <select id="templateSelect">
          <option value="lower-hebel-site-check-1">Lower Hebel Installation - Site Check 1</option>
        </select>
      </div>

      <div class="form-group">
        <label>Inspection Metadata (JSON)</label>
        <textarea id="metadataJson"></textarea>
      </div>

      <div class="form-group">
        <label>Inspection Binary Images</label>
        <div class="file-dropzone" onclick="document.getElementById('imageFiles').click()">
          <div style="font-size: 24px; margin-bottom: 4px;">📷</div>
          <div style="font-size: 12px; font-weight: 600;">Click to upload images</div>
          <div style="font-size: 10px; color: var(--muted); margin-top: 2px;">Supports JPEG, PNG, WEBP</div>
          <input type="file" id="imageFiles" multiple accept="image/*" style="display: none;" onchange="updateFileList()" />
        </div>
        <div class="file-list" id="fileList"></div>
      </div>

      <button class="btn" id="generateBtn" onclick="generatePdfReport()">
        <div class="spinner" id="btnSpinner"></div>
        <span id="btnText">Generate PDF Inspection Report</span>
      </button>
    </div>

    <!-- RIGHT PREVIEW PANEL -->
    <div class="panel preview-container">
      <div class="panel-title">
        <span>Live PDF Document Preview</span>
        <a id="downloadLink" href="#" target="_blank" style="display: none; color: var(--teal); font-size: 12px; font-weight: 700; text-decoration: none;">Download PDF ⬇</a>
      </div>

      <div class="metrics-bar" id="metricsBar" style="display: none;">
        <div class="metric-box">
          <div class="metric-val" id="metricSize">--</div>
          <div class="metric-lbl">PDF File Size</div>
        </div>
        <div class="metric-box">
          <div class="metric-val" id="metricPages">--</div>
          <div class="metric-lbl">Page Count</div>
        </div>
        <div class="metric-box">
          <div class="metric-val" id="metricImages">--</div>
          <div class="metric-lbl">Images Processed</div>
        </div>
        <div class="metric-box">
          <div class="metric-val" id="metricProfile" style="color: var(--teal);">High</div>
          <div class="metric-lbl">Compression Pass</div>
        </div>
      </div>

      <iframe id="pdfFrame" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    const sampleMetadata = {
      "reportId": "HSC1-4106-20260402",
      "templateId": "lower-hebel-site-check-1",
      "reportTitle": "Site Check 1 Inspection",
      "reportType": "Lower Hebel Installation",
      "builder": "BOLD CONSTRUCTION",
      "checkDate": "02/04/2026",
      "siteChecksCompleted": "HSC1 - Check 1",
      "property": {
        "lotNumber": "4106",
        "addressLine": "Heathcote Circuit",
        "suburb": "REDLAND BAY",
        "postcode": "4165",
        "fullAddress": "Lot 4106 Heathcote Circuit, REDLAND BAY QLD 4165"
      },
      "inspector": {
        "name": "Senior Site Inspector",
        "company": "HWD Trade"
      },
      "branding": {
        "companyName": "HWD Trade",
        "primaryColour": "#0F172A",
        "accentColour": "#00AEEF",
        "secondaryColour": "#14B8A6"
      },
      "responses": {
        "powerInstalled": "Completed",
        "powerMarked": "Conduit Visible",
        "waterInstalled": "Water Onsite",
        "binEmptyingRequired": "Not Required",
        "siteCleanRequired": "Not Required",
        "doubleSkinWires": "Completed",
        "wireHeight": "Completed",
        "airConditioningPipe": "Set Inside Stud Cavity",
        "gasPipes": "Completed",
        "waterPipes": "Completed",
        "sarkingInstalled": "Partially Completed",
        "windowsInstalled": "Completed",
        "windowReveals": "Correct",
        "doorsInstalled": "Completed",
        "doorJambReveals": "Correct",
        "slidersInstalled": "Completed",
        "garageDoorJamb": "Completed",
        "garageDoorJambWidth": "Correct",
        "garageHead": "Correct",
        "garageHeadNotes": "",
        "frameToFacia": "Correct",
        "edgeProtectionRemoved": "Completed",
        "scaffoldRemoval": "Not Required",
        "zeroBoundaryInstallation": "Cannot Install",
        "zeroBoundaryNotes": "Temporary platform needed as boundary wall is over 1.2m lower.",
        "frameCheck": "Correct",
        "pierFraming": "0x Pier Frame",
        "additionalFraming": "Not Required",
        "framingNotes": "",
        "slabRebate": "Correct",
        "soilHeight": "Less Than 100mm",
        "soilHeightNotes": "",
        "termiteBarrierPierSlab": "0x Pier to Slab",
        "termiteBarrierPierFooting": "1x Pier to Footing",
        "termiteBarrierOrdered": "Ordered by HWD"
      },
      "generalNotes": [
        "Temporary platform needed as boundary wall is over 1.2m lower.",
        "Fix sarking before the next inspection."
      ],
      "imageMetadata": [
        { "fileName": "photo-01.jpg", "caption": "Front elevation overview of site", "section": "General Site", "sequence": 1 },
        { "fileName": "photo-02.jpg", "caption": "Zero boundary inspection area", "section": "Edge Protection, Scaffold and Zero Boundary", "sequence": 2 }
      ],
      "options": {
        "includeCoverPage": true,
        "includeSummary": true,
        "includeOutstandingItems": true,
        "includePhotographs": true,
        "includeImageCaptions": true,
        "includePageNumbers": true,
        "maximumPdfSizeMb": 20
      }
    };

    document.getElementById("metadataJson").value = JSON.stringify(sampleMetadata, null, 2);

    document.getElementById("loadSampleBtn").onclick = () => {
      document.getElementById("metadataJson").value = JSON.stringify(sampleMetadata, null, 2);
    };

    function updateFileList() {
      const input = document.getElementById("imageFiles");
      const fileList = document.getElementById("fileList");
      fileList.innerHTML = "";
      for (let file of input.files) {
        const item = document.createElement("div");
        item.className = "file-item";
        item.innerHTML = `<span>${file.name}</span><span>${(file.size / 1024).toFixed(1)} KB</span>`;
        fileList.appendChild(item);
      }
    }

    async function generatePdfReport() {
      const btn = document.getElementById("generateBtn");
      const btnText = document.getElementById("btnText");
      const spinner = document.getElementById("btnSpinner");
      const pdfFrame = document.getElementById("pdfFrame");
      const metricsBar = document.getElementById("metricsBar");
      const downloadLink = document.getElementById("downloadLink");

      try {
        btn.disabled = true;
        btnText.innerText = "Generating PDF...";
        spinner.style.display = "inline-block";

        const formData = new FormData();
        const jsonStr = document.getElementById("metadataJson").value;
        formData.append("metadata", jsonStr);

        const imageFiles = document.getElementById("imageFiles").files;
        for (let file of imageFiles) {
          formData.append("images", file);
        }

        const res = await fetch("/api/v1/inspection-reports/generate", {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        if (!data.success) {
          alert("Generation Error: " + (data.error?.message || "Unknown error"));
          return;
        }

        pdfFrame.src = data.pdfUrl;
        downloadLink.href = data.pdfUrl;
        downloadLink.style.display = "inline-block";

        document.getElementById("metricSize").innerText = `${data.pdfSizeMb} MB`;
        document.getElementById("metricPages").innerText = data.pageCount;
        document.getElementById("metricImages").innerText = data.processedImageCount;
        document.getElementById("metricProfile").innerText = data.compressionProfile;
        metricsBar.style.display = "grid";

      } catch (err) {
        alert("Request Failed: " + err.message);
      } finally {
        btn.disabled = false;
        btnText.innerText = "Generate PDF Inspection Report";
        spinner.style.display = "none";
      }
    }
  </script>
</body>
</html>
